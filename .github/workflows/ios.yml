name: iFreeRDP iOS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      full_codecs:
        description: Build the FFmpeg H.264/HEVC path (slower)
        required: false
        default: false
        type: boolean
      device:
        description: Sign and build an iPhone/iPad artifact (protected environment)
        required: false
        default: false
        type: boolean
      unsigned_device:
        description: Build an unsigned iPhone/iPad IPA for local signing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iOS Simulator
    if: github.event_name != 'workflow_dispatch' || inputs.unsigned_device != true
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare toolchain
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Configure
        env:
          FULL_CODECS: ${{ inputs.full_codecs || false }}
        run: |
          set -euo pipefail
          if [[ "$FULL_CODECS" == "true" ]]; then
            codec_args="-DWITH_FFMPEG=ON"
          else
            codec_args=""
          fi

          cmake -S client/iOS -B build/ios-simulator \
            -C ci/cmake-preloads/config-ios.cmake \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/ios.toolchain.cmake" \
            -DPLATFORM=SIMULATORARM64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DIOS_BUNDLE_IDENTIFIER=com.example.ifreerdp \
            -DIOS_DISPLAY_NAME=iFreeRDP \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist/install" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            ${codec_args:+$codec_args} \
            -G Xcode

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build/ios-simulator --config Release --parallel 3
          cmake --install build/ios-simulator --config Release

      - name: Package simulator app
        run: |
          set -euo pipefail
          test -d dist/install/iFreeRDP.app
          mkdir -p dist/Payload
          cp -R dist/install/iFreeRDP.app dist/Payload/
          (cd dist && zip -qry iFreeRDP-simulator.zip Payload)
          locale_count="$(unzip -Z1 dist/iFreeRDP-simulator.zip | grep -c '^Payload/iFreeRDP\.app/en\.lproj/Localizable\.strings$')"
          test "$locale_count" -eq 1
          test "$(unzip -Z1 dist/iFreeRDP-simulator.zip | grep -c 'en\.lproj/en\.lproj')" -eq 0

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: iFreeRDP-simulator
          path: dist/iFreeRDP-simulator.zip
          if-no-files-found: error

  static-check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check iOS source invariants
        run: ./scripts/check-ios-source.sh

  device-unsigned:
    name: Unsigned iOS device build
    if: github.event_name == 'workflow_dispatch' && inputs.unsigned_device == true
    runs-on: macos-26
    timeout-minutes: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare toolchain
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure unsigned device build
        env:
          FULL_CODECS: ${{ inputs.full_codecs || false }}
        run: |
          set -euo pipefail
          if [[ "$FULL_CODECS" == "true" ]]; then
            codec_args="-DWITH_FFMPEG=ON"
          else
            codec_args=""
          fi

          cmake -S client/iOS -B build/ios-device-unsigned \
            -C ci/cmake-preloads/config-ios.cmake \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DIOS_BUNDLE_IDENTIFIER=com.example.ifreerdp \
            -DIOS_DISPLAY_NAME=iFreeRDP \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist/device-unsigned-install" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            ${codec_args:+$codec_args} \
            -G Xcode

      - name: Build unsigned app
        run: |
          set -euo pipefail
          cmake --build build/ios-device-unsigned --config Release --parallel 3
          cmake --install build/ios-device-unsigned --config Release
          test -d dist/device-unsigned-install/iFreeRDP.app
          test -x dist/device-unsigned-install/iFreeRDP.app/iFreeRDP
          lipo -info dist/device-unsigned-install/iFreeRDP.app/iFreeRDP | grep -q arm64

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p dist/device-unsigned/Payload
          cp -R dist/device-unsigned-install/iFreeRDP.app dist/device-unsigned/Payload/
          (cd dist/device-unsigned && zip -qry iFreeRDP-unsigned.ipa Payload)
          locale_path='Payload/iFreeRDP.app/en.lproj/Localizable.strings'
          locale_count="$(unzip -Z1 dist/device-unsigned/iFreeRDP-unsigned.ipa | grep -Fxc "$locale_path" || true)"
          nested_locale_count="$(unzip -Z1 dist/device-unsigned/iFreeRDP-unsigned.ipa | grep -Fxc 'Payload/iFreeRDP.app/en.lproj/en.lproj/Localizable.strings' || true)"
          test "$locale_count" -eq 1
          test "$nested_locale_count" -eq 0

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iFreeRDP-unsigned-ipa
          path: dist/device-unsigned/iFreeRDP-unsigned.ipa
          if-no-files-found: error

  device:
    name: Signed iOS device build
    if: github.event_name == 'workflow_dispatch' && inputs.device == true
    runs-on: macos-26
    environment: ios-signing
    timeout-minutes: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare toolchain
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          xcodebuild -version

      - name: Import Apple signing certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/ifreerdp.mobileprovision"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$profile"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          profile_name="$(security cms -D -i "$profile" | plutil -extract Name raw -o - -)"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Configure signed device build
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_IDENTIFIER: ${{ secrets.IOS_BUNDLE_IDENTIFIER }}
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          : "${IOS_TEAM_ID:?missing IOS_TEAM_ID secret}"
          : "${IOS_BUNDLE_IDENTIFIER:?missing IOS_BUNDLE_IDENTIFIER secret}"
          identity="${IOS_CODE_SIGN_IDENTITY:-Apple Development}"
          cmake -S client/iOS -B build/ios-device \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/ios.toolchain.cmake" \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DIOS_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            -DIOS_DISPLAY_NAME=iFreeRDP \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist/device-install" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Manual \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="$identity" \
            -DCMAKE_XCODE_ATTRIBUTE_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=YES \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=YES \
            -G Xcode

      - name: Build signed app
        run: |
          set -euo pipefail
          cmake --build build/ios-device --config Release --parallel 3
          cmake --install build/ios-device --config Release
          test -d dist/device-install/iFreeRDP.app
          codesign --verify --deep --strict --verbose=2 dist/device-install/iFreeRDP.app

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p dist/device/Payload
          cp -R dist/device-install/iFreeRDP.app dist/device/Payload/
          (cd dist/device && zip -qry iFreeRDP-device.ipa Payload)

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: iFreeRDP-device
          path: dist/device/iFreeRDP-device.ipa
          if-no-files-found: error
